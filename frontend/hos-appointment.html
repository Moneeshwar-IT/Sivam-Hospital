<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#071024;color:#cbd5e1}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#0f172a;padding:30px}
.logo{color:#38bdf8;font-weight:700;font-size:24px;margin-bottom:30px}
.sidebar a{display:flex;gap:10px;color:#cbd5e1;padding:10px 0;text-decoration:none}
.content{margin-left:270px;padding:40px}
.title{font-size:36px;margin-bottom:20px;color:#fff}
.cards{display:flex;gap:20px;margin-bottom:30px}
.card{background:#0f172a;padding:20px;border-radius:12px;flex:1}
.card h2{color:#38bdf8;font-size:28px}
.section{background:#0b1220;padding:20px;border-radius:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-bottom:15px}
input,select,textarea,button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px}
input,select,textarea{background:#1e293b;color:white}
textarea{height:120px}
button{background:#38bdf8;color:white;cursor:pointer}
.doctor-count-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}
.doctor-box{background:#0f172a;padding:20px;border-radius:15px}
.count-box{background:#1e293b;padding:25px;border-radius:12px;text-align:center;border-left:4px solid #38bdf8}
.count-box h1{font-size:45px;color:#38bdf8}
@media(max-width:900px){.content{margin-left:80px;padding:20px}.sidebar{width:80px}}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">Sivam<span style="color:#cbd5e1">Medicare</span></div>

<a href="hos-index.html"><i class="fas fa-home"></i>Home</a>
<a href="hos-service.html"><i class="fas fa-stethoscope"></i>Services</a>
<a href="hos-doctor-login.html"><i class="fas fa-user-doctor"></i>Doctor Login</a>
<a href="hos-patients.html"><i class="fas fa-hospital-user"></i>Patients</a>
<a href="hos-appointment.html" class="active"><i class="fas fa-calendar-check"></i>Appointment</a>
<a href="hos-admin.html"><i class="fas fa-lock"></i>Admin Panel</a>
</div>

<div class="content">

<h1 class="title">Appointment Dashboard</h1>

<div class="cards">
  <div class="card"><i class="fas fa-calendar-check"></i><h2 id="totalAppointmentCount">0</h2><p>Total Appointments</p></div>
  <div class="card"><i class="fas fa-user-doctor"></i><h2 id="doctorCount">0</h2><p>Total Doctors</p></div>
</div>

<div class="section">
<h2>Book Appointment</h2>
<form onsubmit="bookAppointment(event)">
  <div class="form-grid">
    <input type="text" id="patientName" placeholder="Patient Name" required>
    <input type="tel" id="patientPhone" placeholder="Phone Number" required>
    <select id="doctorName" required><option value="">Select Doctor</option></select>
    <input type="date" id="appointmentDate" required>
  </div>
  <textarea id="problem" placeholder="Describe Problem" required></textarea>
  <button type="submit">Book Appointment</button>
</form>
</div>

<div class="section doctor-count-grid" id="appointmentList"></div>

</div>

<script>
const API_BASE = "https://sivam-hospital.onrender.com/api";
let doctors = [];

async function loadDoctorOptions() {
  const doctorSelect = document.getElementById("doctorName");
  doctorSelect.innerHTML = `<option value="">Select Doctor</option>`;
  try {
    const res = await fetch(`${API_BASE}/doctors`);
    if (!res.ok) throw new Error('Failed to fetch doctors');
    doctors = await res.json();
  } catch (err) {
    console.error(err);
    doctors = [];
    alert('Unable to load doctors from the server.');
  }
  doctors.forEach(doc => {
    doctorSelect.innerHTML += `<option value="${doc.name}">${doc.name} - ${doc.department || "General"}</option>`;
  });
  document.getElementById("doctorCount").innerText = doctors.length;
}

async function loadAppointments() {
  try {
    const res = await fetch(`${API_BASE}/appointments`);
    if (!res.ok) throw new Error('Failed to fetch appointments');
    const appointments = await res.json();
    document.getElementById("totalAppointmentCount").innerText = appointments.length;
    const appointmentList = document.getElementById("appointmentList");
    appointmentList.innerHTML = "";
    doctors.forEach(doc => {
      const doctorAppointments = appointments.filter(a => a.doctor === doc.name);
      appointmentList.innerHTML += `<div class="doctor-box"><h3><i class="fas fa-user-doctor"></i>${doc.name} - ${doc.department || "General"}</h3><div class="count-box"><h1>${doctorAppointments.length}</h1><p>Appointments Booked</p></div></div>`;
    });
  } catch (err) {
    console.error(err);
    document.getElementById("totalAppointmentCount").innerText = "0";
  }
}

async function bookAppointment(event) {
  event.preventDefault();
  const patientName = document.getElementById("patientName").value;
  const phone = document.getElementById("patientPhone").value;
  const doctor = document.getElementById("doctorName").value;
  const date = document.getElementById("appointmentDate").value;
  const problem = document.getElementById("problem").value;
  try {
    const res = await fetch(`${API_BASE}/appointments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ patientName, phone, doctor, date, problem, status: 'Booked' })
    });
    if (!res.ok) throw new Error('Failed to save appointment');
    await res.json();
    alert('Appointment Booked Successfully');
    event.target.reset();
    await loadAppointments();
  } catch (err) {
    console.error(err);
    alert('Error Booking Appointment');
  }
}

loadDoctorOptions();
loadAppointments();
</script>

</body>
</html>
